<!-- doctype avisa o navegador que esse é um documento HTML5 -->
<!doctype html>
<html lang="en">
  <head>
    <title>Aula 02 - html</title>
  </head>
  <body>
    <h3>Atributos em HTML</h3>

    <p>utilizando o atributo href:</p>

    <!-- a tag <a> cria um link clicável -->
    <!-- o atributo href guarda o endereço (URL) para onde o link leva -->
    <a href="https://github.com/GSlCSN/Proa-Conteudo/pull/1"
      >github do craudio</a
    >
    <!-- tudo entre <a> e </a> vira texto clicável -->
  </body>
</html>
