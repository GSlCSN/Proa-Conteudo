<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteudo Aula 11 - HTML</title>
</head>
<body>
    
    <h1>Div no HTML</h1>

    <div style="background-color: crimson; font-family: monospace; color: black; padding: 20px;">
        <h2>Isso e um h2</h2>
        <p>Isso e um parágrafo</p>
        <p>Isso e outro parágrafo</p>
    </div>

    <p>Isspo e um parágrafo fora da Div</p>

    <hr>

    <h3>Centralizando div na página</h3>

    <div style="background-color: black; font-family: monospace; color: white; padding: 20px; width: 200px; margin: auto;">
        <h2>Isso e um h2</h2>
        <p>Isso e um parágrafo</p>
        <p>Isso e outro parágrafo</p>
    </div>

</body>
</html>
