<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteudo aula 14 - HTML</title>
</head>
<body>

    <h1>JavaScript no HTML</h1>

    <button onclick="document.getElementById('ex1').innerHTML = Date()">Adicionando Data e Hora</button>

    <p id="ex1"></p>

    <hr>

    <h3>Inserindo o conteúdo na pagina com JavaScript</h3>

    <p id="ex2"></p>

    <script>
        document.getElementById("ex2").innerHTML = "Olá,mundo"
    </script>

    <hr>

    <h3>Alterando estilos de elementos com JavaScript</h3>

    <p id="ex3">Somente a dor coletiva gera união</p>

    <button onclick="mudarestilo()">Alterar estilo</button>

    <script>
        // Inserindo conteúdo com o JavaScript
        document.getElementById("ex2").innerHTML = "Olá, mundo"

        // Alterando estilos com o JavaScript
        function mudarestilo(){
            document.getElementById("ex3").style.backgroundColor = "#0F172A";
            document.getElementById("ex3").style.color = "#F97316";
            document.getElementById("ex3").style.border = "4px solid #334155";
            document.getElementById("ex3").style.padding = "10px";
            document.getElementById("ex3").style.fontFamily = "monospace";
        }
    </script>

</body>
</html>
