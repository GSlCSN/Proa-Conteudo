<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteudo Aula06 - HTML</title>
</head>
<body>
    <h1>Formatações para textos do HTML</h1>

    <!-- <b> deixa em negrito, só por questão visual (sem significado extra) -->
    <p>Exemplo de <b>Bold</b></p>
    <!-- <strong> também deixa em negrito, mas indica que o texto tem IMPORTÂNCIA (leitores de tela dão ênfase na voz) -->
    <p>Exemplo de <strong>Strong</strong></p>
    <!-- <i> deixa em itálico, só por questão visual -->
    <p>Exemplo de <i>Italico</i></p>
    <!-- <em> também deixa em itálico, mas indica ÊNFASE no significado da frase -->
    <p>Exemplo de <em>Ênfase</em></p>
    <!-- <small> deixa o texto menor, geralmente usado para avisos, notas de rodapé -->
    <p>Exemplo de <small>Small</small></p>
    <!-- <mark> destaca o texto com um fundo amarelo, como se fosse um marca-texto -->
    <p>Exemplo de <mark>Mark</mark></p>
    <!-- <del> mostra o texto riscado, indicando algo que foi removido/deletado -->
    <p>Exemplo de <del>Del</del></p>
    <!-- <ins> mostra o texto sublinhado, indicando algo que foi inserido/adicionado -->
    <p>Exemplo de <ins>Ins</ins></p>
    <!-- <sub> deixa o texto subscrito (menor e mais abaixo, ex: fórmulas químicas H2O) -->
    <p>Exemplo de <sub>Sub</sub></p>
    <!-- <sup> deixa o texto sobrescrito (menor e mais acima, ex: expoente 2² ) -->
    <p>Exemplo de <sup>Sup</sup></p>

</body>
</html>
