        /* tranformando um link em um botão */

        a:link,a:visited {
            background-color: gray;
            padding: 15px 25px;
            display: inline-block;
            border: 4px solid black;
            color: black;
            text-decoration: none;
            font-family: monospace;
            font-size: 18px;
            font-weight: bold;
        }

        a:link, a:visited {
        background-color: gray;
        padding: 15px 25px;
        display: inline-block;
        border: 4px solid black;
        color: black;
        text-decoration: none;
        font-family: monospace;
        font-size: 18px;
        font-weight: bold;
      }

      a:hover, a:active {
        background-color: black;
        color: gray;
        border: 4px solid gray;
        transition: .3s;
        
      }

      a:active {
        transform: translateY(4px); /* afunda */
        box-shadow: inset 0 0 10px 0 gray;
      }
