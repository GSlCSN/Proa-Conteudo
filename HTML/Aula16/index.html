<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteúdo Aula16 - HTML</title>

    <style>

        * {
            box-sizing: border-box;
        }

        .Esquerda {
            background-color: #1E3A8A;
            padding: 20px;
            float: left;
            width: 20%;
        }

        .Meio {
            background-color: #F97316;
            padding: 20px;
            float: left;
            width: 60%;
          }
        
        .Direita {
            background-color: #D1D5DB;
            padding: 20px;
            float: left;
            width: 20%;
        }

        .Esquerda,.Meio,.Direita{
            font-family: monospace;
            color: black;
        }

        @media screen and (max-width: 800px) {
            .Esquerda,.Meio,.Direita {
                width: 100%;
            }
        }

    </style>

</head>
<body>
    
    <h1>Responsividade no HTML</h1>

    <h3>Imagens Responsivas</h3>

    <img src="kaleb-image.jpg" width="100%">

    <hr>

    <h3>Imagem Responsiva com max-width</h3>

    <img src="kaleb-image.jpg" style="max-width: 100%;">

    <hr>

    <h3 style="font-size: 5vw;">Texto Responsivo com viewport width</h3>

    <p style="font-size: 3vw;">Somente a dor coletiva gera união.</p>

    <hr>

    <h3>Exemplo de responsividade com media-querie</h3>

    <div class="Esquerda">
        <h4>Esquerda</h4>
    </div>
    <div class="Meio">
        <h4>Meio</h4>
    </div>
    <div class="Direita">
        <h4>Direira</h4>
    </div>
    
</body>
</html>
