<!-- Define o idioma da página (aqui está como inglês, mesmo o texto sendo em português) -->
<html lang="en">
  <head>
    <!-- Garante que acentos e caracteres especiais (ç, ã, é) apareçam certinho -->
    <meta charset="UTF-8" />
    <!-- Faz a página se ajustar bem a telas de celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Texto que aparece na aba do navegador -->
    <title>Meu primeiro site</title>
  </head>
  <body>
    <!-- h1 = título principal da página, o maior de todos -->
    <h1>Olá muundo, testando branch teste</h1>

    <!-- h2 = subtítulo, um nível abaixo do h1 (repetido 3 vezes aqui) -->
    <h2>Vai corinthians</h2>
    <h2>Vai corinthians</h2>
    <h2>Vai corinthians</h2>

    <!-- h3 = um nível abaixo do h2 -->
    <h3>testando branch</h3>

    <!-- h4 = um nível abaixo do h3, texto ainda menor -->
    <h4>
      O Travesseiro da tranquilidade existe, mas nem todo mundo pode deitar
      sobre ele.
    </h4>
  </body>
</html>
