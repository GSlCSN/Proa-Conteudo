<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteudo Aula05 - HTML</title>
</head>
<body>
    
    <h1>Utilizando i atributo style para definir estilos em elementos no HTML:</h1>

    <!-- color: define a cor do TEXTO -->
    <p style="color: orange;">eu sou laranja</p>
    <p style="color: brown;">eu sou marrom</p>
    <!-- font-size: tamanho da fonte / font-weight: bold deixa o texto em negrito -->
    <p style="font-size: 30px; font-weight: bold">eu sou destacado</p>

    <hr>

    <h3>Definindo cores do fundo com o atributo style no HTML:</h3>

    <!-- background-color: define a cor do FUNDO atrás do elemento (diferente de "color", que é o texto) -->
    <h2 style="background-color: chocolate;">Eu sou um h2</h2>
    <p style="background-color: firebrick;">Eu sou um parágrafo</p>

</body>
</html>
