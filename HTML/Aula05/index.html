<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conteudo Aula05 - HTML</title>
  </head>
  <body>
    <h1>titulos em html</h1>

    <!-- br cria uma quebra de linha simples -->
    <br />

    <!-- do h1 (maior/mais importante) até o h6 (menor/menos importante) -->
    <h1>Titulo 1</h1>
    <h2>Titulo 2</h2>
    <h3>Titulo 3</h3>
    <h4>Titulo 4</h4>
    <h5>Titulo 5</h5>
    <h6>Titulo 6</h6>

    <!-- hr: linha horizontal separando as seções -->
    <hr />

    <!-- exemplo prático de hierarquia: h1 = tema geral, h2 = categoria, h3 = itens dentro da categoria -->
    <h1>Guia de viagem</h1>

    <h2>América</h2>
    <h3>Brasil</h3>
    <h3>México</h3>

    <h2>Ásia</h2>
    <h3>Japão</h3>
    <h3>China</h3>

    <hr />

    <!-- mesmo um h6 (que normalmente é pequeno) pode ter o tamanho da fonte alterado via style -->
    <h6 style="font-size: 60px">
      Mudando o tamanho do titulo com o atributo style e a propriedade
    </h6>
  </body>
</html>
