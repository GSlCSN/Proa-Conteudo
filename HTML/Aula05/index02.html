<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteudo Aula05 - HTML</title>
</head>
<body>
    <h1>Utilizando páragrafos noHTML:</h1>

    <!-- cada <p> cria um bloco de texto separado, com espaço próprio acima e abaixo -->
    <p>Isso e um páragrafo</p>
    <p>Isso e um páragrafo</p>
    <p>Isso e um páragrafo</p>

    <hr>

    <h3>Exemplos de quebras de parágrafos Utilizando a tag br:</h3>

    <!-- <br> quebra a linha DENTRO do mesmo parágrafo, sem criar um parágrafo novo -->
    <p>A vida é a arte do <br> encontro embora haja <br> tanto desencontro pela vida</p>

    <hr>

    <!-- <pre> exibe o texto exatamente como foi digitado, respeitando espaços e quebras de linha -->
    <pre>
    somente a
    dor coletiva
    gera união.
    </pre>
</body>
</html>
