<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteudo Aula07 - HTML</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background-color: gray;
        }

        h2 {
            background-color: aliceblue;
            font-size: 35px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <h1>CSS no HTML</h1>

    <h3>Exemplos de CSS incline (em linha)</h3>

    <h4 style="color: blue;">Eu sou um H4</h4>

    <p style="color: red;">eu sou um parágrafo</p>

    <hr>

    <h3>Exemplos de CSS iinterno</h3>

    <h2>Eu sou uma girafa</h2>

    <h5>Eu sou um H5</h5>

    <hr>

    <h3>Exemplo de CSS externo</h3>

    <h6>Eu sou um h6</h6>

    <hr>

    <h3>Exemplo de bordas em elementos:</h3>

    <hr>

    <p>isso e um paragrafo</p>
    <p>isso e um paragrafo</p>
    <p>isso e um paragrafo</p>
    <p>isso e um paragrafo</p>


</body>
</html>
