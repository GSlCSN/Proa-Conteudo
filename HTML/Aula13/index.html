<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteudo Aula13 - html</title>

    <style>

        .destaque {
            font-weight: bold;
            color: red;
            font-size: 150%;
        }

        .principal{
            text-align: center;
        }

        .cidade{
            background-color: gray;
            color: white;
            border: 2px solid black;
        }

        .mesma-classe{
            background-color: black;
            color: white;
            padding: 4px;
            font-size: 20px;
            border: 4px solid gray;
        }

    </style>

</head>
<body>
    
    <h1>Class no HTML</h1>

    <h2>Exemplo de <span class="destaque">importancia</span> no conteudo.</h2>

    <p>Exemplo de <span class="destaque">importancia</span> no conteudo.</p>

    <hr>

    <h3>Definindo mais de uma classe para elementos:</h3>
    
    <h2 class="cidade principal">São Paulo</h2>
    <h2 class="cidade">Rio de Janeiro</h2>
    <h2 class="cidade">Natal</h2>

    <hr>

    <h3>Elementos diferentes com a mesma classe</h3>

    <h4 class="mesma-classe">isso e um h4.</h4>

    <p class="mesma-classe">isso e um parágrafo.</p>

</body>
</html>
