<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteudo Aula13 - html</title>

    <style>
        #meu-h2{
            background-color: blue;
            color: white;
            border: 4px solid goldenrod;
            padding: 10px;
        }
    </style>

</head>
<body>
    
    <h1>Id no HTML</h1>

    <h2 id="meu-h2">Eu sou um h2 com id</h2>

    <hr>

    <h3 id="meu-h3">Turma SP16</h3>

    <button onclick="trocar_conteudo ()">Clique para alteral o Conteudo</button>

    <script>
        function trocar_conteudo() {
            document.getElementById("meu-h3").innerHTML = "Deu certo caraio";
            document.getElementById("meu-h3").style.color = "red";
            document.getElementById("meu-h3").style.fontSize = "28px";
        }
    </script>

</body>
</html>
