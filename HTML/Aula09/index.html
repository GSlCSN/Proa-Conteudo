<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteudo Aula09 - HTML</title>
</head>
<body>
    <h1>Imagens no HTML:</h1>

    <img src="kaleb-image.jpg" alt="imagem do kaleb" width="400" height="400">

    <hr>

    <h3>Alterando o tamanho da imagem com CSS:</h3>

    <img src="kaleb-image.jpg" alt="imagem do kaleb" style="width: 300px; height: 300px;">

    <hr>

    <h3>Definindo imagens que estão em outra pasta:</h3>

    <img src="/HTML/Aula09/img/images.jpg" alt="outra imagem do kaleb" style="width: 200px; height: 350px;">

    <hr>

    <h3>Definindo imagens dinamicas no HTML (gif):</h3>

    <img src="/HTML/Aula09/img/programming.gif" alt="men programming" style="width: 100px; height: 100px;">

    <hr>

    <h3>Imagens flutuantes no HTML</h3>

    <p>
        <img src="/HTML/Aula09/img/programming.gif" alt="men programming" style="float: right;">Desgraça de trabalho
    </p>

</body>
</html>
